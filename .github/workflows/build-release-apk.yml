name: Build & Release Android APK (Low-End & itel A70 Optimized)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release, assembleDebug, assembleRelease)'
        required: true
        default: 'assembleRelease'
        type: choice
        options:
          - 'assembleRelease'
          - 'assembleDebug'
          - 'bundleRelease'
      enable_abi_splits:
        description: 'Generate Architecture-Specific APKs (arm64-v8a, armeabi-v7a)'
        required: true
        default: true
        type: boolean
      target_device_profile:
        description: 'Target Device Profile'
        required: true
        default: 'itel_A70_LowEntry_Optimized'
        type: choice
        options:
          - 'itel_A70_LowEntry_Optimized'
          - 'Universal_All_Devices'
          - 'Ultra_Low_RAM_1GB_Profile'

jobs:
  build-apk:
    name: Build Mobile APK (Low-RAM & itel A70 Optimized)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew || true

      - name: Prepare Signing Key
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using repository secret KEYSTORE_BASE64"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ./release.keystore
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          elif [ -f "./debug.keystore.base64" ]; then
            echo "Decoding bundled debug.keystore.base64"
            base64 -d ./debug.keystore.base64 > ./debug.keystore || true
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/debug.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          else
            echo "Generating automated fallback release signing keystore..."
            keytool -genkey -v -keystore ./release.keystore -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=T3D Engine, OU=Mobile, O=AIStudio, L=Global, S=Global, C=US"
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Setup Environment Variables (.env)
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          echo "LOW_RAM_OPTIMIZATION_ENABLED=true" >> .env
          echo "TARGET_DEVICE_PROFILE=${{ github.event.inputs.target_device_profile || 'itel_A70_LowEntry_Optimized' }}" >> .env

      - name: Build Optimized APK with Gradle
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          BUILD_CMD="${{ github.event.inputs.build_type || 'assembleRelease' }}"
          echo "Executing Gradle task: $BUILD_CMD with low-RAM / itel A70 compiler optimizations..."
          gradle $BUILD_CMD --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:+UseG1GC -XX:+ParallelRefProcEnabled" \
            -Pandroid.enableR8.fullMode=true

      - name: Organize APK Artifacts & Generate Checksums
        id: organize_artifacts
        run: |
          mkdir -p build_output/apks
          mkdir -p build_output/metadata
          
          echo "Finding all generated APKs..."
          find app/build/outputs/apk/ -name "*.apk" -type f -exec cp {} build_output/apks/ \;
          
          cd build_output/apks/
          echo "=== Generated APK List ==="
          ls -la
          
          echo "Generating SHA-256 Checksums for Integrity Verification..."
          sha256sum *.apk > ../metadata/checksums.sha256
          cat ../metadata/checksums.sha256
          
          # Renaming APKs for clarity (itel A70 / Low-End Device Profile)
          for f in *.apk; do
            if [[ "$f" == *"release"* ]]; then
              cp "$f" "T3D-Engine-v1.0-itelA70-LowRAM-Universal.apk"
            fi
          done
          
          cd ../..

      - name: Generate Build Specification & Device Compatibility Report
        run: |
          cat << 'EOF' > build_output/metadata/DEVICE_COMPATIBILITY_INFO.md
          # T3D Engine Mobile Installer - Device Compatibility & Optimization Report

          ### Targeted Specifications:
          - **Primary Device**: itel A70 (Unisoc T603 Octa-Core / PowerVR GE8322)
          - **Minimum RAM**: 1.0 GB RAM (Recommended: 2GB - 4GB)
          - **OS Compatibility**: Android 7.0 (API 24) up to Android 14+ / Android Go Edition
          - **Supported ABIs**: `arm64-v8a` (Primary 64-bit), `armeabi-v7a` (32-bit Fallback), `x86_64`

          ### Applied Low-End Optimizations:
          1. **R8 Proguard Aggressive Shrinking**: Minified bytecode, unused resources stripped.
          2. **Adaptive Memory Budget**: Auto-scales 3D frame buffer resolution to preserve heap space.
          3. **Heap Protection (`largeHeap="true"`)**: Prevents OOM crashes during procedural terrain & particle generation.
          4. **Garbage Collection Throttling**: Pre-allocated math matrices & vectors in ECS loops.
          5. **Hardware Acceleration**: GPU compositing enabled for Jetpack Compose studio UI.
          EOF

      - name: Upload APK Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: T3D-Engine-itelA70-LowRAM-Release-APK
          path: |
            build_output/apks/*.apk
            build_output/metadata/checksums.sha256
            build_output/metadata/DEVICE_COMPATIBILITY_INFO.md
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "T3D Engine Release ${{ github.ref_name }} (itel A70 & Low-RAM Optimized)"
          body_path: build_output/metadata/DEVICE_COMPATIBILITY_INFO.md
          files: |
            build_output/apks/*.apk
            build_output/metadata/checksums.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
